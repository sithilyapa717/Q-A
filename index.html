<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Can You Diagnose Me?</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="page landing">
  <script src="/js/bg.js"></script>
  <main class="landing-main">
    <div class="landing-top">
      <span class="landing-logo">Live diagnosis activity</span>
      <h1 class="landing-title">
        <span class="landing-title-line"><span class="landing-title-text">Can You</span></span>
        <span class="landing-title-line"><span class="landing-title-text">Diagnose Me?</span></span>
      </h1>
      <p class="subtitle">One case. New clues each round. Lock in your answer.</p>
    </div>
    <nav class="landing-nav">
      <a class="role-card role-card-host" href="/host">
        <span class="role-card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 5h16v3H4V5zm0 5.5h16v3H4v-3zm0 5.5h10v3H4v-3z" fill="currentColor"/>
          </svg>
        </span>
        <span class="role-card-body">
          <span class="role-card-title">Host</span>
          <span class="role-card-desc">Create room &amp; advance questions</span>
        </span>
        <span class="role-card-arrow" aria-hidden="true">→</span>
      </a>
      <a class="role-card role-card-play" href="/client">
        <span class="role-card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="7" y="2.5" width="10" height="19" rx="2.5" stroke="currentColor" stroke-width="2"/>
            <path d="M10.5 6h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="14" r="2.5" stroke="currentColor" stroke-width="2"/>
          </svg>
        </span>
        <span class="role-card-body">
          <span class="role-card-title">Participant</span>
          <span class="role-card-desc">Join &amp; answer each question</span>
        </span>
        <span class="role-card-arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
